name: Publish to Azure Artifacts
on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  PublishToAzureArtifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - name: Require a release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: test "$REF_TYPE" = tag
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify release build, publication and runtime
        run: bash scripts/ci/verify.sh
      - name: Publish verified JARs to Azure DevOps Artifacts
        # Reuse the exact JARs exercised above; do not rebuild them during publication.
        run: ./gradlew publishMainPublicationToAzureArtifactsRepository -x bootJar -x jar --console=plain
        env:
          AZURE_DEVOPS_ARTIFACT_USERNAME: ${{ secrets.AZURE_DEVOPS_ARTIFACT_USERNAME }}
          AZURE_DEVOPS_ARTIFACT_TOKEN: ${{ secrets.AZURE_DEVOPS_ARTIFACT_TOKEN }}
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-verification-reports
          path: |
            build/reports/
            build/test-results/
          retention-days: 14
