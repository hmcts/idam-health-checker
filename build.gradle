plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
    id "org.springframework.boot" version "4.1.1"
    id 'maven-publish'
    id "io.freefair.lombok" version "9.8.0"
    id "com.gorylenko.gradle-git-properties" version "4.0.1"
}

def buildNumber = System.getenv("RELEASE_VERSION")?.replace("refs/tags/", "") ?: "DEV-SNAPSHOT"

group = 'com.github.hmcts'
version = buildNumber

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1' }
}

bootRun {
    systemProperties = System.properties
}

gitProperties {
    // Change date format in git.properties file.
    dateFormat = "yyyy-MM-dd HH:mm:ssZ"
}

ext {
    springCloudVersion = "2025.1.3"
    reformLoggingVersion = "6.1.9"
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'io.github.openfeign:feign-hc5'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'

    implementation 'com.microsoft.azure:azure-keyvault:1.2.6'
    implementation 'com.microsoft.azure:adal4j:1.6.7'
    // The legacy Azure SDK and its token response handler still use Jackson 2.
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    implementation 'org.springframework.ldap:spring-ldap-core'

    implementation "com.github.hmcts.java-logging:logging:${reformLoggingVersion}"
    implementation 'org.apache.logging.log4j:log4j-api'
    implementation 'org.apache.logging.log4j:log4j-to-slf4j'
    implementation 'io.opentelemetry:opentelemetry-api'

    implementation 'org.apache.commons:commons-collections4:4.4'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.hamcrest:hamcrest-core'
    testImplementation 'org.hamcrest:hamcrest-library'
    testImplementation 'org.springframework:spring-test'

    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core'

    testImplementation "org.wiremock:wiremock-standalone:3.3.1"
}

publishing {
    publications {
        Main(MavenPublication) {
            from components.java
            artifact bootJar
            groupId = project.group
            artifactId = rootProject.name
            version = project.version
        }
    }
    repositories {
        maven {
            name = "Ci"
            url = layout.buildDirectory.dir('ci-repository')
        }
        maven {
            name = "AzureArtifacts"
            url = uri("https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1")
            credentials {
                username = System.getenv("AZURE_DEVOPS_ARTIFACT_USERNAME")
                password = System.getenv("AZURE_DEVOPS_ARTIFACT_TOKEN")
            }
        }
    }
}

bootJar {
    manifest {
        attributes( 'Implementation-Version': archiveVersion )
    }
}

test {
    useJUnitPlatform()
    // Mockito inline instrumentation appends to the bootstrap classpath, disabling CDS.
    jvmArgs '-Xshare:off'
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
    }
}

sourceSets {
    integrationTest
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('cleanCiRepository', Delete) {
    delete layout.buildDirectory.dir('ci-repository')
}

tasks.named('publishMainPublicationToCiRepository') {
    dependsOn tasks.named('cleanCiRepository')
}

def integrationTest = tasks.register('integrationTest', Test) {
    description = 'Verifies the locally published JAR in a separate Java process.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform { includeEngines 'junit-jupiter' }
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    dependsOn tasks.named('test'), tasks.named('publishMainPublicationToCiRepository')
    // Publication and runtime checks must run even when compiled tests are unchanged.
    outputs.upToDateWhen { false }
    systemProperty 'verification.buildDir', layout.buildDirectory.get().asFile.absolutePath
    systemProperty 'verification.version', project.version.toString()
    systemProperty 'verification.commit', providers.exec {
        commandLine 'git', 'rev-parse', 'HEAD'
    }.standardOutput.asText.get().trim()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

tasks.named('check') {
    dependsOn integrationTest
}
